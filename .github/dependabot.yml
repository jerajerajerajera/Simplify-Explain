# Keeps the GitHub Actions in the workflows current: one grouped pull request a week, merged by the repo's thread when
# the checks are green. The plugin has no composer.json or package.json of its own (it runs on Pelican's vendor).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      ci-actions:
        patterns: ['*']
