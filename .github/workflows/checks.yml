name: Checks
on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  # A change to text only (docs, Markdown) skips the panel: tests and pint still run, so the check stays green.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          case "${{ github.event_name }}" in
            pull_request) base="origin/${{ github.base_ref }}" ;;
            push) base="${{ github.event.before }}" ;;
            *) echo "code=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          files=$(git diff --name-only "$base" HEAD 2>/dev/null) || files=unknown
          printf 'Changed:\n%s\n' "$files"
          if printf '%s\n' "$files" | grep -qvE '^(docs/|LICENSE|.*\.md$)'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; echo "::notice::Text only: the panel smoke is skipped"; fi
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: bash tests/run.sh
      - run: bash tests/docs-sync.sh
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: pint
      - run: pint --test
  # Installs the plugin in a real Pelican panel and opens its pages, so an error that only shows when the panel loads the code blocks the merge.
  panel-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - pelican: '1.0.0-beta38'
            php: '8.3'
          - pelican: '1.0.0-rc.2'
            php: '8.4'
          # With the real Simplify core (main), not a stub: the add-on opens inside Simplify (P-1).
          - pelican: '1.0.0-rc.2'
            php: '8.4'
            simplify: 'main'
    name: panel-smoke (Pelican ${{ matrix.pelican }}${{ matrix.simplify && format(', Simplify {0}', matrix.simplify) || '' }})
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, sqlite3, zip
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g yarn
      - name: Install Pelican ${{ matrix.pelican }}
        run: |
          git clone --quiet --depth 1 --branch "v${{ matrix.pelican }}" https://github.com/pelican-dev/panel.git panel
          cd panel
          composer install --no-interaction --no-progress --prefer-dist
          sed -i "s/'version' => 'canary'/'version' => '${{ matrix.pelican }}'/" config/app.php
          cp .env.example .env
          sed -i 's/^APP_INSTALLED=.*/APP_INSTALLED=true/; s/^APP_DEBUG=.*/APP_DEBUG=true/; s#^APP_URL=.*#APP_URL=http://localhost#' .env
          printf 'DB_CONNECTION=sqlite\nQUEUE_CONNECTION=database\nCACHE_STORE=file\nSESSION_DRIVER=file\nMAIL_MAILER=log\n' >> .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --force
          yarn install --silent
      - name: Install Simplify ${{ matrix.simplify }}
        if: matrix.simplify
        run: |
          git clone --quiet --depth 1 --branch "${{ matrix.simplify }}" https://github.com/jerajerajerajera/simplify.git panel/plugins/simplify
          rm -rf panel/plugins/simplify/.git
          cd panel
          php artisan p:plugin:install simplify
          php artisan p:plugin:list | grep -E '\| Simplify .*\| enabled' || { echo 'Simplify did not install'; exit 1; }
      - name: Install Simplify Explain
        run: |
          mkdir -p panel/plugins/simplify-explain
          tar -C plugin --exclude=.git --exclude=dist -cf - . | tar -C panel/plugins/simplify-explain -xf -
          cd panel
          php artisan p:plugin:install simplify-explain
          php artisan p:plugin:list | tee plugins.txt
          grep -E 'Simplify Explain .*\| enabled' plugins.txt || { echo 'Simplify Explain did not install'; exit 1; }
      - name: Open the pages
        working-directory: panel
        run: |
          php plugins/simplify-explain/tests/panel/smoke.php | tee smoke.txt
          grep -q '^All steps passed$' smoke.txt
      - name: PHPStan (level 5, in the panel)
        if: matrix.simplify == 'main' # the add-on's classes extend the core's
        working-directory: panel
        # After the smoke: installing larastan brings PHPUnit into the panel, which changes how Livewire's test helpers behave.
        run: |
          composer require --dev larastan/larastan --no-interaction --no-progress --quiet
          # No baseline: the clean-up list is done (4 Nov 2026), so every finding fails the check.
          test ! -e plugins/simplify-explain/phpstan-baseline.neon || { echo 'A PHPStan baseline came back: fix the findings instead'; exit 1; }
          vendor/bin/phpstan analyse --configuration plugins/simplify-explain/phpstan.neon --memory-limit 1G --no-progress --error-format=github
      - name: Laravel log
        if: failure()
        run: grep -h -E '^\[[0-9-]+ [0-9:]+\]' panel/storage/logs/*.log | cut -c1-600 | tail -n 12 || true
  # The update path (Jeroen 3 Nov): from the Hub-stable 1.1.0 with every setting filled in to this version, then the
  # previous release back over it, then uninstall and install again.
  update-path:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: update-path (1.1.0 → this, previous back, reinstall)
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, sqlite3, zip
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g yarn
      - name: Install Pelican 1.0.0-rc.2
        run: |
          git clone --quiet --depth 1 --branch v1.0.0-rc.2 https://github.com/pelican-dev/panel.git panel
          cd panel
          composer install --no-interaction --no-progress --prefer-dist
          sed -i "s/'version' => 'canary'/'version' => '1.0.0-rc.2'/" config/app.php
          cp .env.example .env
          sed -i 's/^APP_INSTALLED=.*/APP_INSTALLED=true/; s/^APP_DEBUG=.*/APP_DEBUG=true/; s#^APP_URL=.*#APP_URL=http://localhost#' .env
          printf 'DB_CONNECTION=sqlite\nQUEUE_CONNECTION=database\nCACHE_STORE=file\nSESSION_DRIVER=file\nMAIL_MAILER=log\n' >> .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --force
          yarn install --silent
      - name: Install Explain 1.1.0 (the Hub-stable) with its settings filled in
        run: |
          git clone --quiet --depth 1 --branch v1.1.0 "https://github.com/${{ github.repository }}.git" panel/plugins/simplify-explain
          rm -rf panel/plugins/simplify-explain/.git
          cd panel
          php artisan p:plugin:install simplify-explain
          php ../plugin/tests/panel/update-check.php fill
          rm -rf plugins/simplify-explain
      - name: Install this version over it
        run: |
          mkdir -p panel/plugins/simplify-explain
          tar -C plugin --exclude=.git --exclude=dist -cf - . | tar -C panel/plugins/simplify-explain -xf -
          cd panel
          # As Admin → Plugins and the Hub install it: in a queue job.
          php artisan tinker --execute="App\Jobs\Plugin\InstallPlugin::dispatch(App\Models\User::factory()->create(), 'simplify-explain');"
          php artisan queue:work --max-jobs=1 --stop-when-empty
          php artisan p:plugin:list | tee plugins.txt
          grep -E 'Simplify Explain .*\| enabled' plugins.txt || { echo 'Simplify Explain did not install'; exit 1; }
          test "$(grep -c '| Simplify Explain ' plugins.txt)" = 1 || { echo 'Simplify Explain is listed twice'; exit 1; }
          php ../plugin/tests/panel/update-check.php kept
      - name: Install this version over its own tables
        # An install that stopped halfway leaves tables without their migration rows; the next install keeps them.
        working-directory: panel
        run: |
          php artisan tinker --execute="DB::table('migrations')->where('migration', 'like', '%simplify_explain%')->delete();"
          php artisan tinker --execute="app('migrator')->run(base_path('plugins/simplify-explain/database/migrations')); echo 'ran '.DB::table('migrations')->where('migration', 'like', '%simplify_explain%')->count();" | tee again.txt
          grep -qx "ran $(ls plugins/simplify-explain/database/migrations | grep -c simplify_explain)" again.txt || { echo 'Explain did not install over its own tables'; exit 1; }
          php ../plugin/tests/panel/update-check.php kept
      - name: Put the previous release back over this version
        # Someone who goes back (or the Beelink script that restores the folder) must not get a broken panel.
        run: |
          previous=$(git ls-remote --tags --refs "https://github.com/${{ github.repository }}.git" 'v*' | sed 's#.*/##' | sort -V | tail -n 1)
          echo "Previous release: $previous"
          cp panel/plugins/simplify-explain/plugin.json /tmp/explain-plugin.json
          rm -rf panel/plugins/simplify-explain
          git clone --quiet --depth 1 --branch "$previous" "https://github.com/${{ github.repository }}.git" panel/plugins/simplify-explain
          rm -rf panel/plugins/simplify-explain/.git
          # Pelican keeps the plugin's status in the meta of its plugin.json: keep it, as a restored folder would.
          php -r '$old = json_decode(file_get_contents("/tmp/explain-plugin.json"), true); $file = "panel/plugins/simplify-explain/plugin.json"; $new = json_decode(file_get_contents($file), true); $new["meta"] = $old["meta"] ?? []; file_put_contents($file, json_encode($new, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));'
          cd panel
          php artisan optimize:clear > /dev/null
          php ../plugin/tests/panel/update-check.php kept
      - name: Uninstall and install again
        run: |
          cp panel/plugins/simplify-explain/plugin.json /tmp/explain-plugin.json
          rm -rf panel/plugins/simplify-explain
          mkdir -p panel/plugins/simplify-explain
          tar -C plugin --exclude=.git --exclude=dist -cf - . | tar -C panel/plugins/simplify-explain -xf -
          # Pelican keeps the plugin's status in the meta of its plugin.json: keep it, as a restored folder would.
          php -r '$old = json_decode(file_get_contents("/tmp/explain-plugin.json"), true); $file = "panel/plugins/simplify-explain/plugin.json"; $new = json_decode(file_get_contents($file), true); $new["meta"] = $old["meta"] ?? []; file_put_contents($file, json_encode($new, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));'
          cd panel
          # Compiled views of the previous version stay valid by date (the files keep their old times): clear them,
          # as Pelican does after an update.
          php artisan optimize:clear > /dev/null
          php ../plugin/tests/panel/update-check.php kept
          php artisan p:plugin:uninstall simplify-explain --no-interaction | tee uninstall.txt
          grep -q 'Plugin uninstalled' uninstall.txt || { echo 'Simplify Explain did not uninstall'; exit 1; }
          php artisan p:plugin:list | tee plugins.txt
          ! grep -E 'Simplify Explain .*\| enabled' plugins.txt || { echo 'Simplify Explain is still enabled'; exit 1; }
          php artisan p:plugin:install simplify-explain
          php artisan p:plugin:list | grep -E 'Simplify Explain .*\| enabled' || { echo 'Simplify Explain did not install again'; exit 1; }
          # Pelican rolls back the migrations on uninstall; Explain's down() keeps the data, so everything comes back.
          php ../plugin/tests/panel/update-check.php kept
      - name: Laravel log
        if: failure()
        run: grep -h -E '^\[[0-9-]+ [0-9:]+\]' panel/storage/logs/*.log | cut -c1-600 | tail -n 12 || true
